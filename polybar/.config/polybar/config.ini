[colors]
; Base colors from your scheme
base = #161312
mantle = #292522
crust = #000000
text = #ECE1D7
subtext0 = #867462
subtext1 = #C1A78E
surface0 = #34302C
surface1 = #403A36
surface2 = #867462
overlay0 = #7B9695
overlay1 = #C1A78E
overlay2 = #ECE1D7
blue = #7F91B2
lavender = #A3A9CE
sapphire = #89B3B6
sky = #7B9695
teal = #78997A
green = #78997A
yellow = #E49B5D
peach = #D47766
maroon = #BD8183
red = #BD8183
mauve = #B380B0
pink = #CF9BC2
flamingo = #CF9BC2
rosewater = #ECE1D7
transparent = #00000000

